<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Poojitha B</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f8f6f1; --ink: #1c2321; --muted: #5c6662; --accent: #0f766e; --accent-ink: #0b5a54; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
      }
      .code { margin: 0; font: 600 14px ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--accent); }
      h1 { margin: 12px 0 8px; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.03em; }
      p { margin: 0; color: var(--muted); font-size: 16px; }
      a {
        display: inline-block; margin-top: 28px; padding: 13px 22px; border-radius: 14px;
        background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
      }
      a:hover { background: var(--accent-ink); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This page doesn’t exist on my portfolio.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
